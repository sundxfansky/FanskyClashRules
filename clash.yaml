    type: http
    behavior: classical
    format: text
    url: "https://superfastgh.sundxai.workers.dev/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"
    path: ./ruleset/LocalAreaNetwork.list
