port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true

# 1. 外部节点订阅（自动下载更新外部节点）


# 2. 策略组（完全对齐你 ini 中的 custom_proxy_group 顺序与参数）
proxy-groups:
  - name: 🚀 节点选择
    type: select
    include-all: true
    proxies:
      - ♻️ 自动选择
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🌍 国外媒体
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🎯 全球直连

  - name: 📲 电报信息
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  - name: Ⓜ️ 微软服务
    type: select
    include-all: true
    proxies:
      - 🎯 全球直连
      - 🚀 节点选择

  - name: 🍎 苹果服务
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

  - name: 📢 谷歌FCM
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择

  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择

# 3. 远程规则集（Mihomo 会自动把这些 GitHub 文件下载到本地 ./ruleset/ 目录）
rule-providers:
